<!DOCTYPE html>
<html lang="es-ES">
    <head>
        <title>Tema 5 Ejercicio 1B</title>
        <meta charset="utf-8">
        <style>
            h2 {
                color: seagreen;
            }
            p:first-of-type {
                color: blue;
            }
            p:nth-child(even) {
                background-color: papayawhip;
            }
            p:nth-child(4) {
                color: orange;
                font-size: 20px;
            }
            p:nth-child(odd) {
                color: maroon;
                font-size: 30px;
                font-weight: bold;
            }
            p:last-child {
                color: green;
            }
        </style>
    </head>
    <body>
        <h2>Ejemplo 2!!!</h2>
        <p>Álava</p>
        <p>Albacete</p>
        <p>Alicante</p>
        <p>Almeria</p>
        <p>Asturias</p>
        <p>Avíla</p>
        <p>Badajoz</p>
        <p>Barcelona</p>
    </body>
</html>
